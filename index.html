<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark mode demo</title>
    <script>
      // Blocking: set the theme before first paint to avoid a flash.
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          try {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            theme = 'light';
          }
        }
        root.setAttribute('data-theme', theme);
        root.style.setProperty('color-scheme', theme);
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="theme.js"></script>
    <script type="module" src="footer.js"></script>
  </head>
  <body>
    <header class="site-header" id="top" tabindex="-1">
      <h1>Dark mode demo</h1>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Dark mode"
        aria-pressed="false"
        title="Switch to dark mode"
      >
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </header>
    <main>
      <h2>Heading level 2</h2>
      <h3>Heading level 3</h3>
      <p>Body text with a <a href="#">sample link</a>.</p>
      <p class="muted">Muted secondary text.</p>
      <div class="card">
        <h3>Card</h3>
        <p>Content on a surface with a border.</p>
      </div>
      <p>
        <label for="sample-input">Text input</label><br />
        <input id="sample-input" type="text" placeholder="Type here" />
      </p>
      <p><button class="button" type="button">Button</button></p>
    </main>
    <footer class="site-footer">
      <span>© <span id="current-year"></span></span>
      <a class="back-to-top" href="#top">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </body>
</html>
